name: CI Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Postgres descartável do job: os testes de banco nunca tocam o Supabase do projeto.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lgpd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis descartável do job: exercita o caminho real de enfileiramento via
      # RQ (app/core/queue.py), não só o fallback em BackgroundTasks.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/lgpd_test
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/lgpd_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium (Playwright)
        run: playwright install --with-deps chromium

      - name: Rodar Ruff
        run: ruff check .

      - name: Rodar Pyright
        run: pyright app

      - name: Rodar testes
        run: pytest
